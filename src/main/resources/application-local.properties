# ─────────────────────────────────────────────────────────────────────────────
# LOCAL DEVELOPMENT OVERRIDES
# This file is loaded automatically when no active profile is set (local dev).
# It is listed in .gitignore — never commit it with real credentials.
# ─────────────────────────────────────────────────────────────────────────────

# Database — your local PostgreSQL credentials
spring.datasource.password=${DB_PASSWORD}

# JWT secret — must be at least 64 characters for HS256
jwt.secret=local-dev-only-secret-not-for-production-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx

# Brevo SMTP — credentials for local email sending
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.username=${BREVO_USERNAME}
spring.mail.password=${BREVO_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
mail.from=wisewealth.mf@gmail.com
