# Server Configuration
server.port=8080
server.servlet.context-path=/api/v1

# Activate the 'local' profile by default for local development.
# In production/CI, override this with: --spring.profiles.active=prod
# (and supply DB_PASSWORD + JWT_SECRET as real environment variables).
spring.profiles.default=local

# Database Configuration
# Secrets MUST be supplied via environment variables — do not hardcode here.
# Set DB_URL, DB_USERNAME, DB_PASSWORD, JWT_SECRET in the OS environment or
# your deployment platform (Docker, Railway, etc.) before starting the app.
# spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/wisewealth_db}
# spring.datasource.url=${DB_URL:jdbc:postgresql://neondb_owner:npg_nl3xeLWpcQ6C@ep-still-thunder-awi98u58-pooler.c-12.us-east-1.aws.neon.tech/wisewealth_db?sslmode=require&channel_binding=require}
spring.datasource.url=${DB_URL:jdbc:postgresql://ep-still-thunder-awi98u58-pooler.c-12.us-east-1.aws.neon.tech/wisewealth_db?sslmode=require&channel_binding=require}
# spring.datasource.username=neondb_owner
# spring.datasource.password=npg_nl3xeLWpcQ6C
spring.datasource.username=${DB_USERNAME:neondb_owner}
spring.datasource.password=${DB_PASSWORD:npg_nl3xeLWpcQ6C}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# JWT Configuration
# jwt.secret MUST be a random string of at least 64 characters — set via JWT_SECRET env var.
jwt.secret=${JWT_SECRET}
jwt.expiration=3600000

# CORS — override CORS_ORIGIN env var in production (e.g. https://wisewealth.in)
cors.allowed-origin=${CORS_ORIGIN:http://localhost:3000}

# Security — trusted reverse-proxy IPs for X-Forwarded-For resolution.
# In production, set TRUSTED_PROXY to your load-balancer's IP (e.g. 10.0.0.1).
# Leaving this empty means X-Forwarded-For is never trusted (safe default).
security.trusted-proxy-ips=${TRUSTED_PROXY:}

# Pageable — cap maximum page size accepted from query params to prevent OOM
spring.data.web.pageable.max-page-size=100

# Frontend URL used in verification emails — override with FRONTEND_URL env var in production
app.frontend-url=${FRONTEND_URL:http://localhost:3000}

# Logging — keep web layer at WARN in production to avoid leaking headers
logging.level.root=INFO
logging.level.com.wisewealth=DEBUG
logging.level.org.springframework.web=WARN

# Application Name
spring.application.name=wisewealth-api

# Brevo SMTP relay — smtp-relay.brevo.com requires your production server IP
# to be whitelisted in Brevo dashboard (SMTP & API → Authorized IPs).
# Username = your Brevo login email, Password = Brevo SMTP API key (not account password).
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.username=${BREVO_USERNAME:}
spring.mail.password=${BREVO_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
mail.from=${MAIL_FROM:wisewealth.mf@gmail.com}
spring.mail.properties.mail.debug=false
# Google Drive direct-download URL (uc?export=download forces download, not the /view preview page)
app.free-guide.pdf-url=https://drive.google.com/uc?export=download&id=1ttL1kMIRa6QEVTQqpXTfqp7PJy4MzJQu

# Wealth-check report storage directory (override with WEALTH_REPORTS_DIR env var in production)
app.wealth-check.reports-dir=${WEALTH_REPORTS_DIR:./wealth-check-reports}

# Allow PDF uploads — 30 MB file / 32 MB request (PNG at scale:2.5 is ~8-12 MB)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=32MB